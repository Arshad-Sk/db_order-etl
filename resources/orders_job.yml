resources:
  jobs:
    orders_etl:
      name: orders-etl-${bundle.target}
      max_concurrent_runs: 1
      timeout_seconds: 7200
      queue:
        enabled: true

      schedule:
        quartz_cron_expression: "0 0 2 * * ?"      # daily 02:00
        timezone_id: "Asia/Dubai"
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - ${var.alert_email}
        on_duration_warning_threshold_exceeded:
          - ${var.alert_email}

      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 5400

      job_clusters:
        - job_cluster_key: etl_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.node_type_id}
            data_security_mode: SINGLE_USER
            autoscale:
              min_workers: 1
              max_workers: 4
            azure_attributes:
              availability: SPOT_WITH_FALLBACK_AZURE
              first_on_demand: 1
              spot_bid_max_price: -1
            spark_conf:
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"
            custom_tags:
              project: orders-etl
              env: ${bundle.target}

      tasks:
        - task_key: bronze
          job_cluster_key: etl_cluster
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: etl_pipeline
            entry_point: run
            parameters: ["--task", "bronze", "--env", "${bundle.target}", "--catalog", "${var.catalog}",
                         "--storage_account", "${var.storage_account}", "--run_id", "{{job.run_id}}"]
          libraries:
            - whl: ../dist/*.whl

        - task_key: silver
          depends_on:
            - task_key: bronze
          job_cluster_key: etl_cluster
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: etl_pipeline
            entry_point: run
            parameters: ["--task", "silver", "--env", "${bundle.target}", "--catalog", "${var.catalog}",
                         "--storage_account", "${var.storage_account}", "--run_id", "{{job.run_id}}"]
          libraries:
            - whl: ../dist/*.whl

        - task_key: gold
          depends_on:
            - task_key: silver
          job_cluster_key: etl_cluster
          max_retries: 1
          python_wheel_task:
            package_name: etl_pipeline
            entry_point: run
            parameters: ["--task", "gold", "--env", "${bundle.target}", "--catalog", "${var.catalog}",
                         "--storage_account", "${var.storage_account}", "--run_id", "{{job.run_id}}"]
          libraries:
            - whl: ../dist/*.whl

        - task_key: validate
          depends_on:
            - task_key: gold
          job_cluster_key: etl_cluster
          python_wheel_task:
            package_name: etl_pipeline
            entry_point: run
            parameters: ["--task", "validate", "--env", "${bundle.target}", "--catalog", "${var.catalog}",
                         "--storage_account", "${var.storage_account}", "--run_id", "{{job.run_id}}"]
          libraries:
            - whl: ../dist/*.whl
