resources:
  jobs:
    orders_etl:
      name: orders-etl-${bundle.target}
      max_concurrent_runs: 1
      timeout_seconds: 7200
      queue:
        enabled: true

      schedule:
        quartz_cron_expression: "0 0 2 * * ?"      # daily 02:00
        timezone_id: "Asia/Dubai"
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - ${var.alert_email}

      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: bronze
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: etl_pipeline
            entry_point: run
            parameters: ["--task", "bronze", "--env", "${bundle.target}", "--catalog", "${var.catalog}",
                         "--storage_account", "${var.storage_account}", "--run_id", "{{job.run_id}}"]

        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: etl_pipeline
            entry_point: run
            parameters: ["--task", "silver", "--env", "${bundle.target}", "--catalog", "${var.catalog}",
                         "--storage_account", "${var.storage_account}", "--run_id", "{{job.run_id}}"]

        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: default
          max_retries: 1
          python_wheel_task:
            package_name: etl_pipeline
            entry_point: run
            parameters: ["--task", "gold", "--env", "${bundle.target}", "--catalog", "${var.catalog}",
                         "--storage_account", "${var.storage_account}", "--run_id", "{{job.run_id}}"]

        - task_key: validate
          depends_on:
            - task_key: gold
          environment_key: default
          python_wheel_task:
            package_name: etl_pipeline
            entry_point: run
            parameters: ["--task", "validate", "--env", "${bundle.target}", "--catalog", "${var.catalog}",
                         "--storage_account", "${var.storage_account}", "--run_id", "{{job.run_id}}"]